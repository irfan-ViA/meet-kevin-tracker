name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk KevinTracker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KevinTracker-apk
          path: KevinTracker.apk
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-build-${{ github.run_number }}" KevinTracker.apk --latest \
            --title "Kevin Tracker app (build ${{ github.run_number }})" \
            --notes "Download KevinTracker.apk on your Android phone and open it to install or update."
